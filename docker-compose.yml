# Stage 1 deployment for agrocer-stg01.
#
# One service and no database: Stage 1 keeps all family data in the browser's
# localStorage. Postgres joins this file in Stage 2.

services:
  agrocer:
    build:
      context: .
      dockerfile: Dockerfile
    image: agrocer:stage1
    container_name: agrocer
    restart: unless-stopped
    ports:
      # Bound to the VM's LAN address so phones on the home network can reach it.
      - '3000:3000'
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: '1'
    # Modest ceilings suited to the 2 vCPU / 3 GB staging VM.
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
